[build]
  base = "Merchantise"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Enforce strict HTTPS with HSTS (1 year + subdomains + preload)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Prevent clickjacking attacks while allowing Cashfree hosted modals
    X-Frame-Options = "SAMEORIGIN"
    
    # Prevent MIME type sniffing attacks
    X-Content-Type-Options = "nosniff"
    
    # Protect user privacy by sanitizing referrer data on cross-origin requests
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Restrict unneeded browser hardware access
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self 'https://sdk.cashfree.com' 'https://api.cashfree.com' 'https://payments.cashfree.com')"
    
    # Enable Cross-Site Scripting (XSS) filter
    X-XSS-Protection = "1; mode=block"
    
    # Content Security Policy: Authorize Cashfree payment gateway, Google Sheets endpoint, and Google Fonts
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.cashfree.com https://api.cashfree.com https://payments.cashfree.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.cashfree.com https://sdk.cashfree.com https://payments.cashfree.com https://script.google.com https://script.googleusercontent.com; frame-src 'self' https://sdk.cashfree.com https://api.cashfree.com https://payments.cashfree.com https://*.cashfree.com; form-action 'self' https://api.cashfree.com https://payments.cashfree.com https://*.cashfree.com; base-uri 'self'; object-src 'none';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
